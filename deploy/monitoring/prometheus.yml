# Prometheus configuration for AI Video Platform
# Usage:
#   prometheus --config.file=deploy/monitoring/prometheus.yml
#
# Or use with docker:
#   docker run -p 9090:9090 -v $(pwd)/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
#
# Auth: If DAEMON_METRICS_TOKEN is set on the daemon, set PROMETHEUS_DAEMON_TOKEN

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "daemon"
    scrape_interval: 10s
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["localhost:7456"]
        labels:
          service: "daemon"
          layer: "media-engine"
    # If DAEMON_METRICS_TOKEN is set, uncomment below:
    # authorization:
    #   type: Bearer
    #   credentials: "${PROMETHEUS_DAEMON_TOKEN}"

  - job_name: "laravel"
    scrape_interval: 15s
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "laravel"
          layer: "control-plane"
