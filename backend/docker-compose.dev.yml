# Project name — scopes ALL containers/networks/volumes per deployment so multiple
# projects can coexist on one server. Each deployment sets STACK_NAME in its .env
# (e.g. STACK_NAME=aivideo-clientA); defaults to "aivideo".
name: ${STACK_NAME:-aivideo}

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  web_node_modules:
  web_next:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Dev resource caps — prevent the boot-time "thundering herd" (all compilers
    # grabbing every core at once → 500%+ CPU spike). Ceilings only; idle usage is far lower.
    mem_limit: 768m
    cpus: 1.5
    ports:
      - "8000:8000"
    env_file: .env.docker
    environment:
      REVERB_HOST: reverb
      DAEMON_URL: http://daemon:7456
      DAEMON_CALLBACK_URL: http://app:8000/api/daemon/webhook
      DB_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - ../apps/skills:/skills
      - ./docker-php-ext-upload.ini:/usr/local/etc/php/conf.d/docker-php-ext-upload.ini
    command: >
      sh -c "
        [ ! -f vendor/autoload.php ] && composer install;
        php artisan storage:link --force 2>/dev/null;
        php artisan migrate --force 2>/dev/null;
        exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload
      "
    healthcheck:
      test: ["CMD", "php", "artisan", "tinker", "--execute=echo 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      daemon:
        condition: service_healthy
      # Storage phải sẵn sàng cùng app — nếu không, app "healthy" nhưng ghi ảnh/asset
      # fail (đúng lỗi từng gặp: app up mà minio down). minio-setup tạo bucket rồi thoát.
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - app-network

  # ====================
  # DAEMON (Media Engine)
  # ====================
  daemon:
    build:
      context: ../apps/daemon
      dockerfile: Dockerfile.dev
    working_dir: /app
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 5m
    env_file:
      - .env.docker
      - ../apps/daemon/.env
    environment:
      - SIMULATION_MODE=${SIMULATION_MODE:-0}
      - SIMULATION_LATENCY_IMAGE=${SIMULATION_LATENCY_IMAGE:-3000}
      - SIMULATION_LATENCY_VIDEO=${SIMULATION_LATENCY_VIDEO:-20000}
      - SIMULATION_LATENCY_AUDIO=${SIMULATION_LATENCY_AUDIO:-2000}
      - SIMULATION_LATENCY_JITTER=${SIMULATION_LATENCY_JITTER:-0.3}
      # xah.io is DashScope-backed: always speak the nested `parameters` body so
      # size/watermark/thinking_mode reach the provider. thinking_mode stays
      # per-request (do NOT set OPENAI_IMAGE_THINKING_MODE here).
      - OPENAI_IMAGE_DASHSCOPE_PARAMS=1
    # ffmpeg + node_modules are baked into the image (Dockerfile.dev). The anon volume
    # at /app/node_modules seeds from that baked copy, so the container starts node
    # directly — no runtime ffmpeg/npm install (that used to stall on apk over the network,
    # leaving the daemon unhealthy on every recreate). Fallback `npm ci` only fires if the
    # volume is ever wiped without a rebuild. After changing deps: rebuild + --renew-anon-volumes.
    command: >
      sh -c "
        [ -d node_modules/better-sqlite3/build ] || npm ci;
        exec node --import tsx ./src/index.ts
      "
    volumes:
      - ../apps/daemon:/app
      - /app/node_modules
      - ../apps/skills:/skills
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7456/api/health',(r)=>{process.exit(r.statusCode===200?0:1);})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ====================
  # REVERB (WebSocket Server)
  # ====================
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: 384m
    cpus: 0.5
    ports:
      - "8080:8080"
    env_file: .env.docker
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      REVERB_HOST: 0.0.0.0
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    command: >
      sh -c "
        [ ! -f vendor/autoload.php ] && composer install;
        exec php artisan reverb:start --debug
      "
    healthcheck:
      test: ["CMD", "php", "artisan", "tinker", "--execute=echo 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: 512m
    cpus: 1.0
    env_file: .env.docker
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      REVERB_HOST: reverb
      DAEMON_URL: http://daemon:7456
    command: >
      sh -c "
        [ ! -f vendor/autoload.php ] && composer install;
        exec php /var/www/artisan queue:work --tries=3 --timeout=3600
      "
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - ./docker-php-ext-upload.ini:/usr/local/etc/php/conf.d/docker-php-ext-upload.ini
    healthcheck:
      test: ["CMD", "php", "artisan", "tinker", "--execute=echo 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # HandleJobCompletion + GenerateThumbnail ghi asset lên storage → cần minio sẵn sàng.
      minio:
        condition: service_healthy
    networks:
      - app-network

  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    command: >
      sh -c "
        [ ! -f vendor/autoload.php ] && composer install;
        [ ! -f node_modules/.package-lock.json ] && npm install;
        exec npm run dev -- --host=0.0.0.0
      "
    networks:
      - app-network

  # ====================
  # WEB (Next.js frontend) — containerized like the rest of the stack.
  # Port default 3000; override with WEB_PORT on a shared host/VPS to avoid clashes.
  # ====================
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.dev
    # Next.js dev compile is the heaviest — give it the most, but still capped.
    mem_limit: 1536m
    cpus: 2.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      # File-change detection for HMR over macOS bind mounts (webpack fallback path).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # BFF route handlers run server-side INSIDE this container, so the browser's
      # localhost:8000 (NEXT_PUBLIC_LARAVEL_URL) can't reach Laravel from here — use the
      # in-network service name. Browser still uses NEXT_PUBLIC_LARAVEL_URL for direct calls.
      LARAVEL_INTERNAL_URL: http://app:8000
    # NEXT_PUBLIC_* are read from the bind-mounted apps/web/.env — the browser runs on the
    # host, so its localhost:8000 (Laravel) / localhost:8080 (Reverb) URLs resolve correctly.
    command: sh -c "[ ! -d node_modules/next ] && npm install; exec npm run dev -- -H 0.0.0.0"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "3307:3306"
    env_file: .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-dev}
      MYSQL_DATABASE: ${DB_DATABASE:-aivideo_dev}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-dev}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: .env.docker
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - minio_data:/data
    networks:
      - app-network

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env.docker
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminio/aivideo-dev --ignore-existing;
      mc policy set public myminio/aivideo-dev;
      echo 'MinIO bucket aivideo-dev ready';
      "
    networks:
      - app-network

  # phpMyAdmin with HTTP Basic Auth (UNCOMMENT ONLY IF NEEDED)
  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin:latest
  #   ports:
  #     - "8081:80"
  #   environment:
  #     PMA_HOST: mysql
  #     PMA_PORT: 3306
  #     PMA_USER: root
  #     PMA_PASSWORD: root-secret
  #     UPLOAD_LIMIT: 512M
  #     PMA_ABSOLUTE_URI: http://localhost:8081
  #   volumes:
  #     - ./.htpasswd:/etc/apache2/.htpasswd
  #   depends_on:
  #     - mysql
  #   networks:
  #     - app-network